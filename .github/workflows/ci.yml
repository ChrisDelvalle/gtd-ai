name: Deterministic checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.93.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: source
          cache-on-failure: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            adapter/package-lock.json
      - run: npm --prefix web ci && npm --prefix adapter ci
      - run: npm --prefix web run build
      - run: cp web/dist/widget-adapter.html adapter/widget.html
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --features postgres-operator -- -D warnings
      - run: cargo test --locked --features postgres-operator
      - name: Verify fictional demo against Rust
        run: |
          TODO_ENVIRONMENT=test TODO_BENCHMARK_NOW=2026-11-06T18:00:00Z cargo run --locked --features benchmark-clock --example demo_reference > "$RUNNER_TEMP/demo-reference.json"
          node web/demo/check-reference.mjs "$RUNNER_TEMP/demo-reference.json"
      - run: node --experimental-transform-types --test *.test.mjs *.test.ts
        working-directory: web
      - run: npm --prefix adapter test
      - run: python3 -m unittest discover -s deploy/multi-user -p 'test_*.py'
      - run: python3 -m unittest discover -s deploy/tests -p 'test_*.py'
      - run: python3 -m unittest discover -s deploy/backups -p 'test_*.py'
      - run: python3 scripts/check-repository.py
      - run: python3 scripts/test-postgres.py
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.93.0'
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: browsers
          cache-on-failure: true
          save-if: ${{ matrix.browser == 'chromium' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            adapter/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build && cargo build --locked
      - run: bash scripts/prepare-browser-runner.sh
      - run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
        working-directory: web
      - run: docker pull getmeili/meilisearch:v1.54.3@sha256:e68913ab7d6f5b159529e472cfd362ce3c741fafd3c127961b2142abbe41b3c9
      - run: node scripts/test-browser-with-search.mjs
        env:
          GTD_TEST_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: disposable-browser-${{ matrix.browser }}
          path: web/test-results/
          retention-days: 7
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.93.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            adapter/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cargo-deny
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-deny-0.19.7-rust-1.93
      - run: cargo install cargo-deny --version 0.19.7 --locked
        if: steps.cargo-deny.outputs.cache-hit != 'true'
      - run: cargo deny check
      - run: npm --prefix web ci && npm --prefix adapter ci
      - run: npm --prefix web audit && npm --prefix adapter audit
      - run: python3 scripts/secret-scan.py
  installation:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y restic
      - uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4
        with:
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/gtd-build-cache/current
          key: ${{ runner.os }}-${{ runner.arch }}-images-v1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**', 'deploy/multi-user/Dockerfile', 'scripts/rust-notices.py', 'third_party/**', 'LICENSE', 'NOTICE') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-images-v1-
      - run: python3 deploy/build.py --cache-dir "$RUNNER_TEMP/gtd-build-cache"
      - run: python3 scripts/test-installation.py
      - run: python3 scripts/test-operator-cli.py

  demos:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            adapter/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build:demos
      - run: npm --prefix web run test:demos
      - run: bash scripts/prepare-browser-runner.sh
      - run: npx --no-install playwright install --with-deps chromium webkit
        working-directory: web
      - run: npm --prefix web run test:demos:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: demo-browser-results
          path: web/demo-results/
          retention-days: 7
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: web/dist-demo
  publish-demos:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [source, browsers, dependencies, installation, demos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish tested static demos
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
