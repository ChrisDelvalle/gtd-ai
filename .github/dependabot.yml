version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 1
    groups:
      rust-dependencies:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: monthly}
    open-pull-requests-limit: 1
    groups:
      web-dependencies:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /adapter
    schedule: {interval: monthly}
    open-pull-requests-limit: 1
    groups:
      adapter-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 1
    groups:
      ci-actions:
        patterns: ['*']
